<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안양시 무장애 네비게이션</title>
    
    <!-- 네이버 지도 API 불러오기 (ncpKeyId 뒤에 본인의 Client ID가 잘 들어갔는지 확인하세요!) -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=d7vewux24g"></script>
</head>
<body>
    <!-- 지도가 화면에 표시될 영역 -->
    <div id="map" style="width:100%;height:100vh;"></div>

    <script>
        // 1. 안양시청 좌표를 중심으로 하는 지도 옵션 설정
        var mapOptions = {
            center: new naver.maps.LatLng(37.3943, 126.9568),
            zoom: 15 // 숫자가 클수록 더 확대됩니다.
        };

        // 2. 지도 생성 및 화면에 띄우기
        var map = new naver.maps.Map('map', mapOptions);

        // 3. (테스트용) 안양시 교통약자 편의시설 위치에 마커 꽂기
        var markerPosition = new naver.maps.LatLng(37.3945, 126.9575);
        var marker = new naver.maps.Marker({
            position: markerPosition,
            map: map,
            title: '안양시 전동휠체어 충전소 (예시)'
        });
    </script>
</body>
</html>
