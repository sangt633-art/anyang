<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안양시 무장애 네비게이션</title>
    
    <style>
        /* 1. 웹(PC) 환경에 맞는 전체 레이아웃 (Flexbox 사용) */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
            overflow: hidden; /* 페이지 전체 스크롤 방지 */
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 2. 상단 헤더 영역 */
        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 15px 25px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* 3. 본문 영역 (좌측 사이드바 + 우측 지도) */
        #main-content {
            display: flex;
            flex: 1; /* 헤더를 제외한 남은 공간을 모두 차지 */
        }

        /* 4. 좌측 사이드바 (향후 공공데이터 리스트가 들어갈 자리) */
        #sidebar {
            width: 350px; /* PC 모니터에 적합한 패널 너비 */
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            padding: 20px;
            overflow-y: auto; /* 리스트가 길어지면 자체 스크롤 생성 */
            box-sizing: border-box;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #34495e;
        }

        /* 향후 자바스크립트로 생성할 리스트 아이템 디자인 미리보기 */
        .facility-card {
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .facility-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-color: #3498db;
        }

        /* 5. 우측 지도 영역 */
        #map-container {
            flex: 1; /* 사이드바를 제외한 나머지 화면을 꽉 채움 */
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- 네이버 지도 API 불러오기 (ncpClientId 유지) -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=d7vewux24g"></script>
</head>
<body>
    <div id="app-container">
        <!-- 헤더 영역 -->
        <header>♿ 안양시 무장애 네비게이션</header>
        
        <div id="main-content">
            <!-- 좌측 패널 (데이터 목록) -->
            <aside id="sidebar">
                <div class="sidebar-title">🔍 주변 편의시설 목록</div>
                
                <!-- (테스트용) 나중에 공공데이터를 통해 자바스크립트로 반복 생성할 UI 입니다 -->
                <div class="facility-card">
                    <h4 style="margin: 0 0 8px 0; color: #2980b9;">안양시청 전동휠체어 급속충전기</h4>
                    <p style="margin: 0; font-size: 14px; color: #666;">경기도 안양시 동안구 시민대로 235</p>
                </div>
                <div class="facility-card">
                    <h4 style="margin: 0 0 8px 0; color: #2980b9;">평촌역 엘리베이터 (1번 출구)</h4>
                    <p style="margin: 0; font-size: 14px; color: #666;">경기도 안양시 동안구 부림로 260</p>
                </div>
            </aside>

            <!-- 우측 지도 영역 -->
            <div id="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 지도 기본 옵션 설정 (PC 환경에 맞게 UI 컨트롤러들 추가)
            var mapOptions = {
                center: new naver.maps.LatLng(37.3943, 126.9568),
                zoom: 15, 
                minZoom: 11,
                
                // PC 마우스 사용자를 위해 줌 컨트롤러 크기를 키움 (LARGE)
                zoomControl: true, 
                zoomControlOptions: {
                    position: naver.maps.Position.TOP_RIGHT,
                    style: naver.maps.ZoomControlStyle.LARGE 
                },
                
                // 일반지도 / 위성지도 전환 버튼 (PC에서 정보 전달력 상승)
                mapTypeControl: true,
                
                // 축척 바 표시
                scaleControl: true 
            };

            // 2. 지도 생성
            var map = new naver.maps.Map('map', mapOptions);

            // 3. 마커 꽂기
            var markerPosition = new naver.maps.LatLng(37.3945, 126.9575);
            var marker = new naver.maps.Marker({
                position: markerPosition,
                map: map,
                title: '안양시청 전동휠체어 급속충전기'
            });
            
            // 향후 추가할 기능: 좌측의 'facility-card'를 클릭하면 
            // 지도의 중심이 해당 마커로 스르륵 이동(panTo)하는 기능을 넣으면 아주 좋습니다.
        });
    </script>
</body>
</html>
    </script>
</body>
</html>
